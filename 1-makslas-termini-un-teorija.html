<!doctype html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mākslas termini un teorija</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Izkārtojums: tumša "galerijas siena" ar mākslas darbu kreisajā pusē, skolotāja vadības panelis labajā pusē. Optimizēts interaktīvajai tāfelei. */
:root{
  color-scheme:light;
  --paper:#eceef5; --surface:#ffffff; --surface-2:#f5f6fb; --ink:#141830; --muted:#565d82; --line:#d7dbea;
  --accent:#2b3fd4; --accent-ink:#ffffff; --accent-soft:#e3e6ff; --cadmium:#f2b705; --cadmium-ink:#241b00;
  --wall:#f4efe5; --wall-2:#ebe3d4; --wall-line:#d8cdb8; --wall-ink:#2b2518; --wall-muted:#6c6352; --gold-ink:#8a5f00;
  --warm:#e2703a; --cool:#3d7ed8; --neutral:#9aa0b4;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:16px;
  --frame-bg:#c9cddb;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;overflow-x:hidden}
*{box-sizing:border-box}
button,input,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stage :focus-visible{outline-color:var(--accent)}

.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);grid-template-columns:minmax(0,1fr);gap:12px;padding-block:12px;padding-inline:16px}
/* 16:9 darba laukums 1600×900, ko mērogo līdzi ekrānam */
@media (min-width:761px){
  html,body{height:100%;overflow:hidden}
  body{background:var(--frame-bg)}
  .app{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;background:var(--paper);container-type:size}
}

/* Galvene */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;min-width:0}
.brand{display:flex;align-items:center;gap:12px;min-width:0;cursor:pointer;border-radius:12px}
.brand:hover h1{color:var(--accent)}
.brand:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
.mark{width:44px;height:44px;border-radius:12px;background:var(--accent);display:grid;place-items:center;flex:none}
.mark svg{width:26px;height:26px}
.brand h1{font-size:1.35rem;font-weight:800;line-height:1.1}
.brand p{margin:0;color:var(--muted);font-size:.85rem;letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.brand .author{font-size:.9rem;color:var(--muted);margin-top:2px}
.brand .author b{color:var(--ink);font-weight:700}
.top-actions{display:flex;flex-wrap:wrap;gap:8px}

.btn{min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ai{background:var(--cadmium);color:var(--cadmium-ink);border-color:var(--cadmium)}
.btn.icon{width:46px;padding:0;justify-content:center}
.btn svg{width:20px;height:20px;flex:none}

/* Galvenais laukums */
.main{display:grid;grid-template-columns:minmax(250px,24%) minmax(0,1fr) minmax(270px,22%);gap:12px;min-height:0;min-width:0}
.main.noright{grid-template-columns:minmax(250px,24%) minmax(0,1fr)}
.main.noright .right{display:none}

/* Skatuve */
.stage{background:var(--wall);color:var(--wall-ink);border-radius:var(--r);display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);min-height:0;min-width:0;overflow:hidden}
.caption{padding:10px 16px;font-size:.95rem;color:var(--wall-muted);border-bottom:1px solid var(--wall-line);display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-width:0}
.caption b{color:var(--wall-ink);font-weight:600}
.caption .tag{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:6px;background:var(--wall-2);color:var(--gold-ink)}
.caption .load{margin-left:auto;min-height:40px;padding:0 14px;border-radius:10px;border:0;background:var(--cadmium);color:var(--cadmium-ink);font-weight:700;cursor:pointer}
.area{position:relative;min-height:0;min-width:0;overflow:hidden}
.frame{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:0 14px 34px rgba(60,45,20,.28)}
.zoombtn{position:absolute;top:10px;right:10px;z-index:3;display:flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--wall-line);background:rgba(255,255,255,.92);color:var(--wall-ink);font:700 .9rem var(--f-body);cursor:pointer;box-shadow:0 4px 12px rgba(60,45,20,.18)}
.zoombtn:hover{background:#fff}
.zoombtn svg{width:18px;height:18px}
.area.zoom{position:fixed;inset:0;z-index:60;background:rgba(18,15,10,.72);animation:zoomIn .22s ease-out}
.area.zoom .frame{box-shadow:0 24px 70px rgba(0,0,0,.6)}
.area.zoom .sqlab span{color:#fff;background:rgba(10,11,16,.85);min-width:1.6em;text-align:center}
.area.zoom .sqlab span.on{color:#241b00;background:#f5c33b}
.area.zoom .zoombtn{top:16px;right:16px;min-height:48px;font-size:1rem}
@keyframes zoomIn{from{background:rgba(18,15,10,0)}to{background:rgba(18,15,10,.72)}}
@media (prefers-reduced-motion:reduce){.area.zoom{animation:none}}
.frame canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#ov{pointer-events:none;touch-action:none}
.sqlab{position:absolute;inset:0;pointer-events:none}
.sqlab span{position:absolute;transform:translate(-50%,-50%);font:700 15px/1 var(--f-body);color:var(--wall-ink);padding:3px 5px;border-radius:5px;white-space:nowrap}
.sqlab span.on{background:#f5c33b;color:#241b00}
#ov.on{pointer-events:auto}
#pen{touch-action:none;pointer-events:none}
#pen.on{pointer-events:auto;cursor:crosshair}
.drop{position:absolute;inset:12px;border:3px dashed var(--cadmium);border-radius:14px;display:grid;place-items:center;font-family:var(--f-display);font-size:1.6rem;background:rgba(10,11,16,.8);color:#fff;z-index:2}
.gc{width:40px;height:40px;border-radius:50%;border:2px solid #b9ad95;cursor:pointer;padding:0;align-self:center}
.gc.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--wall)}

.strip{display:flex;gap:8px;padding:10px 16px;border-top:1px solid var(--wall-line);overflow-x:auto}
.sw{flex:none;display:flex;align-items:center;gap:8px;min-height:46px;padding:4px 12px 4px 4px;border-radius:12px;border:2px solid var(--wall-line);background:var(--wall-2);color:var(--wall-ink);cursor:pointer;font-size:.9rem;text-align:left}
.sw i{width:36px;height:36px;border-radius:9px;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.sw small{font-family:var(--f-mono);color:var(--wall-muted);font-size:.75rem}
.sw.on{border-color:var(--cadmium)}

.tools{display:grid;grid-template-columns:minmax(0,1fr) minmax(200px,30%);gap:12px 14px;padding:12px 16px 14px;border-top:1px solid var(--wall-line);background:var(--wall-2)}
.tgroups{display:flex;flex-direction:column;gap:8px;min-width:0}
.ttabs{display:flex;flex-wrap:wrap;gap:2px;border-bottom:1px solid var(--wall-line)}
.tt{position:relative;min-height:44px;padding:0 14px;border:0;border-bottom:3px solid transparent;background:transparent;color:var(--wall-muted);font-weight:700;font-size:.9rem;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;margin-bottom:-1px}
.tt.on{color:var(--wall-ink);border-bottom-color:var(--cadmium)}
.tt i{display:none;position:absolute;top:7px;right:3px;width:11px;height:11px;border-radius:50%;background:var(--cadmium);box-shadow:0 0 0 2px var(--wall-2)}
.tt.act i{display:block}
.tt.act{color:var(--gold-ink)}
.tgroups .seg{flex-wrap:wrap;gap:4px}
.tgroups .seg>*{flex:none}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.tb.sm{min-height:40px;padding:0 12px;font-size:.9rem}
.info{position:relative;height:clamp(140px,17vh,190px);height:clamp(140px,17cqh,190px);background:#fffdf8;border:1px solid var(--wall-line);border-radius:12px}
.info-in{position:absolute;inset:0;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:10px;font-size:1rem;line-height:1.4;color:var(--wall-ink)}
#hint{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px}
#hint .muted2{color:var(--wall-muted)}
#hint .lg{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
#hint .lg i{width:16px;height:16px;border-radius:4px;display:inline-block}
.pal2{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:4px}
.pal2 .sw{flex-direction:column;justify-content:center;align-items:center;min-height:0;padding:4px 2px;gap:2px;border-width:2px;font-size:.8rem}
.pal2 .sw i{width:30px;height:30px;border-radius:7px}
.tg{display:flex;flex-direction:column;gap:6px;min-width:0}
.tg>span{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--wall-muted);font-weight:700}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.tb{min-height:44px;padding:0 13px;border-radius:10px;border:1px solid var(--wall-line);background:#fffdf8;color:var(--wall-ink);font-weight:600;font-size:.95rem;cursor:pointer}
.tb:hover{border-color:var(--wall-muted)}
.tb.on{background:var(--cadmium);color:var(--cadmium-ink);border-color:var(--cadmium)}
.tb.ghost{background:transparent;color:var(--wall-muted)}
.pc{width:44px;height:44px;border-radius:10px;border:2px solid #b9ad95;cursor:pointer;padding:0}
.pc.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--wall)}

/* Panelis */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:8px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.gb{border:2px solid transparent;border-radius:12px;padding:6px 8px;min-height:48px;background:transparent;cursor:pointer;text-align:center;display:flex;flex-direction:column;justify-content:center;min-width:0}
.gb b{font-family:var(--f-display);font-size:1.25rem;font-weight:800;line-height:1.1}
.gb small{display:none}
.gb:hover{border-color:var(--line)}
.gb.on{background:var(--surface);border-color:var(--accent)}
.gb.on b{color:var(--accent)}

.steps{display:flex;flex-wrap:wrap;gap:4px;padding:8px 10px;border-bottom:1px solid var(--line)}
.st{flex:1 1 0;max-width:52px;min-width:38px;display:grid;place-items:center;height:44px;padding:0;border-radius:22px;border:2px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700}
.st .stt{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.st em{font-style:normal;font-family:var(--f-mono);font-size:1rem;background:none;width:auto;height:auto}
.st.on{border-color:var(--accent);color:var(--accent)}
.st.on{background:var(--accent);border-color:var(--accent)}
.st.on em{color:var(--accent-ink)}
.st.done{background:var(--accent-soft);border-color:var(--accent-soft)}
.st.done em{color:var(--accent)}

.card,.qcard{flex:1;overflow-y:auto;padding:16px 18px 18px;display:flex;flex-direction:column;gap:16px;min-height:0}
.rhead{padding:12px 18px;border-bottom:1px solid var(--line);background:var(--surface-2);font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.eyebrow{font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.qcard h2{font-size:clamp(1.6rem,3.4vh,3rem);font-size:clamp(1.6rem,3.4cqh,3rem);font-weight:800;line-height:1.1;margin-top:2px}
.qs{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:q}
.qs li{counter-increment:q;display:grid;grid-template-columns:auto 1fr;gap:12px;font-size:clamp(1.15rem,2.6vh,2.2rem);font-size:clamp(1.15rem,2.6cqh,2.2rem);line-height:1.35;font-weight:500}
.qs li::before{content:counter(q);min-width:1.6em;height:1.6em;border-radius:.35em;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--f-mono);font-size:.7em;margin-top:.15em}
.qs li.core::before{content:"★";background:var(--cadmium);color:var(--cadmium-ink)}
.more{align-self:flex-start;min-height:44px;padding:0 16px;border-radius:12px;border:2px dashed var(--accent);background:transparent;color:var(--accent);font-weight:700;cursor:pointer;font-size:1rem}
.qs.extra li{font-size:clamp(1rem,2.1vh,1.7rem);font-size:clamp(1rem,2.1cqh,1.7rem);color:var(--muted)}
.moods{display:flex;flex-wrap:wrap;gap:8px}
.mood{min-height:52px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-size:1rem;font-weight:600;display:flex;align-items:center;gap:8px}
.mood span{font-size:1.5rem}
.mood.on{border-color:var(--accent);background:var(--accent-soft)}
.sub{font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:.95rem}
.chip.on{background:var(--cadmium);border-color:var(--cadmium);color:var(--cadmium-ink)}
.chip.term{border-style:dashed}
.chip.term.on{background:var(--accent-soft);border-color:var(--accent);border-style:solid;color:var(--accent)}
.defs{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.def{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:.98rem}
.def b{color:var(--accent)}
details.theory{border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
details.theory summary{cursor:pointer;padding:10px 14px;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:46px}
details.theory summary::-webkit-details-marker{display:none}
details.theory summary::after{content:"+";font-family:var(--f-mono);color:var(--accent);font-size:1.2rem}
details.theory[open] summary::after{content:"–"}
details.theory p{margin:0;padding:0 14px 12px;font-size:1rem}
.tip{background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:.95rem;color:var(--muted)}
.tip b{color:var(--ink)}
.metabox{border:1px dashed var(--line);border-radius:12px;padding:10px 14px;font-size:.95rem}
.metabox dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 12px}
.metabox dt{color:var(--muted)}
.metabox dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.linkbtn{background:none;border:0;padding:10px 4px;color:var(--accent);font-weight:700;cursor:pointer;text-decoration:underline}

.reveal{width:100%;min-height:52px;border-radius:12px;border:2px dashed var(--accent);background:transparent;color:var(--accent);font-weight:700;cursor:pointer;font-size:1rem}
.facts{display:flex;flex-direction:column;gap:10px}
.fact{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.fact h3{font-family:var(--f-body);font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.fact p{margin:0;font-size:1.02rem}
.fact .note{font-size:.82rem;color:var(--muted)}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px}
.pal button{display:flex;align-items:center;gap:8px;padding:4px;border-radius:10px;border:2px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;min-width:0}
.pal button.on{border-color:var(--accent)}
.pal i{width:34px;height:34px;border-radius:8px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.pal span{font-size:.82rem;line-height:1.2;min-width:0}
.pal small{display:block;font-family:var(--f-mono);color:var(--muted);font-size:.72rem}
.bar{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--surface-2)}
.bar div{height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.85rem;font-variant-numeric:tabular-nums}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.hist{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;align-items:end;height:70px;padding:4px;border-radius:8px;background:var(--surface-2)}
.hist div{border-radius:3px 3px 0 0;min-height:2px;box-shadow:inset 0 0 0 1px rgba(127,127,127,.35)}
.hl{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted)}

.nav{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.nav .btn{flex:1;justify-content:center}
.nav .btn:disabled{opacity:.4;cursor:default}

/* Logi */
.sheet{position:fixed;inset:0;background:rgba(8,10,20,.55);display:grid;place-items:center;padding:16px;z-index:20}
.sheet-in{background:var(--surface);color:var(--ink);border-radius:18px;width:min(700px,100%);max-height:calc(100% - 16px);overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:16px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.sheet-in.wide{width:min(900px,100%)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sheet-head h2{font-size:1.5rem;font-weight:800}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;font-weight:600;color:var(--muted);min-width:0}
.form label.wide{grid-column:1/-1}
.form input{min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);padding:0 12px;font-size:1rem;color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.switch{display:flex;align-items:flex-start;gap:14px;padding:14px;border:1px solid var(--line);border-radius:12px;cursor:pointer}
.switch input{width:26px;height:26px;accent-color:var(--accent);flex:none;margin-top:2px}
.switch b{display:block}
.switch span{color:var(--muted);font-size:.93rem}
.prose{font-size:.98rem}
.prose p{margin:0 0 8px}
.prose h3{font-size:1.15rem;font-weight:700;margin:6px 0 8px}
.muted{color:var(--muted)}
.ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.factjud{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.factjud div{border-radius:12px;padding:12px 14px;background:var(--surface-2)}
.factjud b{display:block;font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.gsearch{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.gsearch input{flex:1 1 220px;min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);padding:0 12px;font-size:1rem;color:var(--ink);min-width:0}
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.gterm{border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.95rem}
.gterm b{display:block;font-family:var(--f-display);font-size:1.05rem;margin-bottom:2px}
.gterm small{display:block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.empty{color:var(--muted);padding:12px 0}
.gterm.style{display:flex;flex-direction:column;gap:4px}
.gterm .sm{font-size:.86rem}
.gterm .sm span{color:var(--muted);font-weight:600}
.gterm a{color:var(--accent);font-weight:600;font-size:.86rem;margin-top:2px}
.lcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.lcard{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;text-decoration:none;color:var(--ink);background:var(--surface-2)}

 tresdalas:{t:'Trešdaļu likums',c:'komp',d:'Laukumu ar divām vertikālām un divām horizontālām līnijām sadala deviņās vienādās daļās. Svarīgos elementus novieto uz līnijām vai to krustpunktos.'},
 zelta:{t:'Zelta griezums',c:'komp',d:'Proporcija aptuveni 1 : 1,618, kurā lielākā daļa attiecas pret mazāko tāpat kā viss pret lielāko (aptuveni 62\u00a0% un 38\u00a0%). Daudzi to uzskata par harmonisku. Matemātiski to aprakstīja jau Eiklīds, bet mākslā tai īpaši pievērsās renesanses mākslinieki.'},
 diagonale:{t:'Diagonālā kompozīcija',c:'komp',d:'Galvenās formas vai kustība izvietota pa diagonāli. Tā rada dinamiku un virza skatienu uz svarīgāko.'},
 horizonts:{t:'Horizonta līnija',c:'komp',d:'Iedomāta līnija skatītāja acu augstumā, kur debesis satiekas ar zemi vai ūdeni. Zems horizonts izceļ debesis, augsts izceļ zemi.'},
 linpersp:{t:'Lineārā perspektīva',c:'komp',d:'Telpas attēlošana, kurā paralēlas līnijas tālumā saiet nozušanas punktā, bet priekšmeti tālumā kļūst mazāki.'},
 gaisapersp:{t:'Gaisa perspektīva',c:'komp',d:'Dziļuma iespaids, ko rada krāsa un tonis: tālumā kontrasti mazinās, krāsas kļūst bālākas un zilganākas.'},
 kolorits:{t:'Kolorīts',c:'krasa',d:'Darba krāsu kopējais raksturs un krāsu attiecību sistēma: silts, vēss, spilgts, pieklusināts, kontrastējošs vai harmonisks.'},
 silt:{t:'Siltās un vēsās krāsas',c:'krasa',d:'Siltās krāsas (sarkanā, oranžā, dzeltenā) saistās ar sauli un uguni un šķiet tuvākas. Vēsās krāsas (zilā, zilganzaļā, violetā) saistās ar ūdeni un ēnu un šķiet attālākas.',k:'Siltās krāsas ir kā saule un uguns: sarkana, oranža, dzeltena. Vēsās krāsas ir kā ūdens un ledus: zila, zilganzaļa, violeta.'},
 pamatkr:{t:'Pamatkrāsas',c:'krasa',d:'Tradicionālajā krāsu aplī tās ir sarkanā, dzeltenā un zilā. Tās nevar sajaukt no citām krāsām, bet, tās jaucot, iegūst daudzas citas: oranžo, zaļo, violeto. Drukā lieto zilganzaļo, purpursarkano un dzelteno krāsu, bet ekrānā jauc sarkanu, zaļu un zilu gaismu.',k:'Sarkanā, dzeltenā un zilā. Tās jaucot, var iegūt daudzas citas krāsas.'},
 papildkr:{t:'Papildkrāsas (komplementārās krāsas)',c:'krasa',d:'Krāsu aplī pretēji novietotas krāsas: sarkanā un zaļā, zilā un oranžā, dzeltenā un violetā. Novietotas blakus, tās viena otru pastiprina.'},
 harmonija:{t:'Krāsu harmonija',c:'krasa',d:'Krāsu saskaņa, piemēram, radniecīgu (krāsu aplī blakus esošu) krāsu harmonija vai vienas krāsas toņu harmonija.'},
 piesat:{t:'Piesātinājums',c:'krasa',d:'Krāsas tīrība un intensitāte. Piesātināta krāsa ir spilgta, nepiesātināta ir pieklusināta, pelēcīga.'},
 tonis:{t:'Tonis (gaišums)',c:'krasa',d:'Laukuma vai krāsas gaišuma pakāpe neatkarīgi no nokrāsas. Ikdienā ar „toni” saprot arī krāsas nokrāsu, piemēram, zilganu toni.',k:'Cik gaišs vai tumšs ir kāds attēla laukums.'},
 tonkontr:{t:'Toņu kontrasts',c:'krasa',d:'Gaišu un tumšu laukumu pretstats. Liels kontrasts rada dramatismu, mazs kontrasts rada maigumu un mieru.'},
 gaismena:{t:'Gaismēna',c:'krasa',d:'Gaismas un ēnas sadalījums uz priekšmeta: atspīdums, gaisma, pusēna, gaismēnas robeža, pašēna, reflekss un krītošā ēna. Gaismēna rada apjoma iespaidu.'},
 faktura:{t:'Faktūra',c:'krasa',d:'Virsmas raksturs, ko var sataustīt: gluda, raupja, reljefa virsma vai biezi uzklāta krāsa.',k:'Kāda virsma ir, ja tai pieskaras: gluda vai raupja.'},
 triepiens:{t:'Triepiens',c:'krasa',d:'Ar otu vai paletes nazi uzklātas krāsas pēda. Tā var būt gluda un gandrīz neredzama vai izteikta, ritmiska un bieza.'},
 materials:{t:'Materiāls',c:'krasa',d:'Viela vai priekšmeti, no kā darbs izgatavots: eļļas krāsa, akvarelis, ogle, marmors, bronza, papīrs, atrasti priekšmeti.'},
 sizets:{t:'Sižets',c:'saturs',d:'Notikums vai situācija, kas attēlota darbā.'},
 motivs:{t:'Motīvs',c:'saturs',d:'Tēmas elements vai attēlojuma priekšmets, piemēram, logs, ceļš, māte ar bērnu. Motīvs var atkārtoties vienā darbā vai mākslinieka daiļradē.'},
 simbols:{t:'Simbols',c:'saturs',d:'Tēls vai priekšmets, kas norāda uz plašāku nozīmi, piemēram, balodis kā miera zīme. Simbola nozīme ir atkarīga no kultūras un laikmeta.'},
 atributs:{t:'Atribūts',c:'saturs',d:'Priekšmets, pēc kura atpazīst tēlu, piemēram, pēc trijzobja atpazīst jūras dievu Neptūnu.'},
 realisms:{t:'Reālistisks attēlojums',c:'saturs',d:'Attēlojums, kas tuvs redzamajai īstenībai: dabiskas proporcijas, apjoms un telpa.'},
 idealiz:{t:'Idealizācija',c:'saturs',d:'Attēlojums, kurā tēls parādīts skaistāks un pilnīgāks nekā dzīvē.'},
 stiliz:{t:'Stilizācija',c:'saturs',d:'Formu vienkāršošana un pārveidošana, lai uzsvērtu raksturīgāko, piemēram, ornamentā.'},
 abstrakc:{t:'Abstrakcija',c:'saturs',d:'Darbs bez atpazīstamiem priekšmetiem. Izteiksmi rada krāsa, līnija, forma un laukums.'},
 noskana:{t:'Noskaņa',c:'saturs',d:'Emocionālais iespaids, ko darbs rada: priecīgs, mierīgs, skumjš, satraucošs, noslēpumains.',k:'Sajūta, kas rodas, skatoties attēlu: prieks, miers, skumjas.'},
 fakts:{t:'Fakts un spriedums',c:'pamat',d:'Faktu var pārbaudīt, aplūkojot darbu („kreisajā pusē ir koks”). Spriedums ir mūsu interpretācija („koks šķiet vientuļš”).'},
 konteksts:{t:'Konteksts',c:'konteksts',d:'Apstākļi, kuros darbs radīts: laikmets, vieta, kultūra, sabiedrība un autora dzīve.'},
 virziens:{t:'Mākslas virziens',c:'konteksts',d:'Mākslinieku grupa vai periods ar kopīgiem principiem, piemēram, impresionisms, kubisms, ekspresionisms.'},
 stils:{t:'Stils',c:'konteksts',d:'Raksturīgu izteiksmes līdzekļu kopums, kas atšķir laikmetu, virzienu vai konkrētu autoru.'},
 interpr:{t:'Interpretācija',c:'konteksts',d:'Darba nozīmes skaidrojums, kas balstīts uz novērojumiem un kontekstu. Var būt vairākas pamatotas interpretācijas.'},
 vertejums:{t:'Vērtējums',c:'konteksts',d:'Argumentēts spriedums par darbu: cik veiksmīgi izteiksmes līdzekļi atbalsta ideju un kāda ir darba ietekme uz skatītāju.'},
 linija:{t:'Līnija',c:'pamat',d:'Pamata izteiksmes līdzeklis: punkta kustības pēda. Līnija var būt taisna, lauzta, viļņota, bieza vai tieva. Ar to veido kontūru, ritmu un kustības virzienu.',k:'Svītra, ko atstāj zīmulis vai ota. Tā var būt taisna, viļņota, bieza vai tieva.'},
 laukums:{t:'Laukums',c:'pamat',d:'Plakana virsmas daļa, kas aizpildīta ar krāsu, toni vai rakstu un ko ierobežo kontūra vai citi laukumi.',k:'Ar krāsu aizpildīta vieta attēlā.'},
 forma:{t:'Forma',c:'pamat',d:'Priekšmeta ārējais veidols. Plaknē forma ir divdimensionāla (aplis, kvadrāts), telpā – trīsdimensionāla (lode, kubs). Formas var būt ģeometriskas vai brīvas (organiskas).',k:'Priekšmeta veidols: apaļš, stūrains, garš vai īss.'},
 apjoms:{t:'Apjoms',c:'komp',d:'Priekšmeta trīsdimensionalitāte: augstums, platums un dziļums. Plaknē apjoma iespaidu rada gaismēna un perspektīva.'},
 siluets:{t:'Siluets',c:'komp',d:'Priekšmeta vai figūras attēls, kurā laukums ārējās kontūras robežās aizpildīts ar vienu krāsu vai toni, bez iekšējām detaļām.',k:'Priekšmeta „ēnas attēls”: redzama tikai ārējā kontūra.'},
 proporcijas:{t:'Proporcijas',c:'komp',d:'Daļu lielumu attiecības savā starpā un pret veselumu, piemēram, galvas augstuma un visas figūras augstuma attiecība.'},
 skatpunkts:{t:'Skatpunkts',c:'komp',d:'Vieta, no kuras skatītājs vai mākslinieks raugās uz attēloto: no augšas (putna lidojuma skatpunkts), acu augstumā vai no apakšas (vardes skatpunkts).'},
 kadrejums:{t:'Kadrējums',c:'komp',d:'Attēla robežu izvēle fotogrāfijā, kino vai glezniecībā: kas nonāk kadrā un kas paliek ārpus tā.'},
 tekstura:{t:'Tekstūra',c:'krasa',d:'Virsmas raksts, ko redz, piemēram, koka šķiedru, marmora vai auduma raksts.'},
 ornaments:{t:'Ornaments',c:'saturs',d:'Raksts, ko veido ritmiski atkārtoti elementi: ģeometriskas figūras, augu vai dzīvnieku motīvi, zīmes. Ar ornamentu rotā priekšmetus, apģērbu un arhitektūru.'},
 mv_glezn:{t:'Glezniecība',c:'pamat',d:'Mākslas veids, kurā attēlu veido ar krāsām uz plaknes, piemēram, uz audekla, papīra, koka dēļa vai sienas. Tehnikas: eļļas glezniecība, akvarelis, guaša, tempera, akrila glezniecība.'},
 mv_graf:{t:'Grafika',c:'pamat',d:'Mākslas veids, kura galvenie izteiksmes līdzekļi ir līnija, laukums, tonis un faktūra. Zīmējums ir unikālā grafika, bet iespiedgrafikā (kokgriezums, linogriezums, oforts, litogrāfija, sietspiede) darbu iespiež vairākos eksemplāros.'},
 mv_teln:{t:'Tēlniecība',c:'pamat',d:'Mākslas veids, kurā no akmens, koka, metāla, māla un citiem materiāliem veido telpiskus darbus – skulptūras un reljefus.'},
 mv_foto:{t:'Fotogrāfija',c:'pamat',d:'Mākslas veids, kurā attēlu iegūst ar kameru, fiksējot gaismu uz gaismjutīga materiāla vai digitāla sensora. Fotogrāfija var būt dokuments, reportāža vai mākslas darbs.'},
 mv_diz:{t:'Dizains',c:'pamat',d:'Priekšmetu, vides un vizuālās komunikācijas mākslinieciska projektēšana, kurā forma ir saistīta ar funkciju: mēbeles, apģērbs, plakāti, logotipi, iepakojums.'},
 mv_arh:{t:'Arhitektūra',c:'pamat',d:'Ēku un telpu projektēšanas un celtniecības māksla, kas apvieno lietderību, izturību un skaistumu.'}
};

 {t:'Fotoreālisms',al:['hiperreālisms','photorealism'],laiks:'1960.–1970. g., ASV',p:'Gleznas, kas izskatās kā fotogrāfijas. Bieži gleznotas pēc fotogrāfijām, ar ikdienas pilsētas motīviem un ļoti precīzām detaļām.',m:'Čaks Klouzs, Ričards Estess',lv:'Miervaldis Polis, Līga Purmale (20. gs. 70. gadi)',u:'p/photorealism'},

 {t:'Futūrisms',al:['futurism'],laiks:'1909.–1916. g., Itālija',p:'Kustības, ātruma, tehnikas un pilsētas cildināšana. Dinamiskas līnijas un atkārtotas formas rada kustības iespaidu.',m:'Umberto Bočoni, Džakomo Balla',lv:'',u:'f/futurism'},

 {t:'Jūgendstils',al:['art nouveau','modern','secesija'],laiks:'1890.–1910. g., Eiropa',p:'Plūstošas, viļņotas līnijas, augu un sievietes tēla motīvi, dekoratīvums, mākslas un dizaina vienotība.',m:'Alfonss Muha, Gustavs Klimts',lv:'Rīgas jūgendstila arhitektūra (Alberta iela, Mihails Eizenšteins), Jānis Rozentāls',u:'a/art-nouveau'},
 {t:'Klasicisms',al:['neoklasicisms','neoclassicism'],laiks:'18. gs. otrā puse – 19. gs. sākums, Eiropa',p:'Antīkās mākslas paraugi: skaidra un līdzsvarota kompozīcija, simetrija, noteikta līnija, varonīgi un morāli sižeti.',m:'Žaks Luijs Davids, Antonio Kanova',lv:'Mežotnes pils (arh. Džakomo Kvarengi, 1797.–1802. g.)',u:'n/neoclassicism'},
 {t:'Konceptuālā māksla',al:['conceptual'],laiks:'20. gs. 60. gadi – mūsdienas',p:'Ideja ir svarīgāka par izpildījumu. Darbs var būt teksts, dokuments, fotogrāfija vai instalācija.',m:'Džozefs Košuts, Sols Levits',lv:'',u:'c/conceptual-art'},
 {t:'Konstruktīvisms',al:['constructivism'],laiks:'1915.–1930. g., Krievija',p:'Ģeometriskas formas, industriāli materiāli, māksla sabiedrības kalpībā. Liela ietekme uz dizainu, plakātu un arhitektūru.',m:'Vladimirs Tatlins, Aleksandrs Rodčenko',lv:'Gustavs Klucis',u:'c/constructivism'},

 {t:'Minimālisms',al:['minimalism'],laiks:'20. gs. 60. gadi, ASV',p:'Vienkāršas ģeometriskas formas, atkārtojums, industriāli materiāli. Nekā lieka: nav ne stāsta, ne emociju.',m:'Donalds Džads, Karls Andrē',lv:'',u:'m/minimalism'},
 {t:'Naivā māksla',al:['naive','naīvā'],laiks:'19.–20. gs.',p:'Mākslinieki bez akadēmiskas izglītības: vienkāršotas formas, spilgtas krāsas, plakana telpa, rūpīgi izstrādātas sīkas detaļas.',m:'Anrī Ruso, Niko Pirosmani',lv:'',u:'n/naive-art'},
 {t:'Neoimpresionisms',al:['puantilisms','pointillism','neo-impressionism'],laiks:'1880.–1890. g., Francija',p:'Tīras krāsas uzklātas mazos punktos, kas sajaucas skatītāja acī. Zinātniska pieeja krāsai un rūpīgi plānota kompozīcija.',m:'Žoržs Sērā, Pols Sinjaks',lv:'',u:'n/neo-impressionism'},
 {t:'Op māksla',al:['op art','optiskā māksla'],laiks:'20. gs. 60. gadi',p:'Optiskas ilūzijas: ģeometriski raksti un kontrasti rada kustības, mirgošanas vai telpas iespaidu.',m:'Viktors Vazarelī, Bridžita Railija',lv:'',u:'o/op-art'},
 {t:'Popārts',al:['pop art','pop māksla'],laiks:'20. gs. 50. gadu beigas – 60. gadi, ASV un Lielbritānija',p:'Masu kultūras attēli: reklāma, komiksi, preces, slavenības. Spilgtas krāsas, sietspiede, atkārtojums.',m:'Endijs Vorhols, Rojs Lihtenšteins',lv:'',u:'p/pop-art'},

  {t:'Ko es redzu?',veidsSel:true,th:'Mākslas darbu skatāmies lēnām. Vispirms tikai stāstām, ko redzam, un vēl nevērtējam.',q:['Ko tu redzi attēlā? Nosauc trīs lietas.','Kas ir pats lielākais? Kas pats mazākais?','Kas atrodas tuvu, un kas ir tālu?','Kādas līnijas un formas tu redzi: taisnas, viļņotas, apaļas, stūrainas?'],terms:['portrets','ainava','klusa','plani'],tools:['draw'],tip:'Pirms sākt, vienojies ar skolēniem: katrs var redzēt citādi, visas domas ir vērtīgas, runājam pa vienam un rādām uz attēla. Ļauj skolēniem nākt pie tāfeles un apvilkt atrasto.',facts:[]},
  {t:'Kādas krāsas?',th:'Krāsas var būt siltas vai vēsas. Siltās krāsas šķiet tuvākas un priecīgākas, vēsās šķiet mierīgākas un tālākas.',q:['Kuras krāsas attēlā ir visvairāk?','Vai krāsas ir siltas kā saule un uguns vai vēsas kā ūdens un ledus?','Atrodi kādu krāsu, kas attēlā parādās vairākās vietās!'],terms:['silt','pamatkr'],tools:['palette','tempv'],tip:'Atver paleti un noklikšķini uz krāsas: rīks parāda, kur tā atrodas attēlā. Vispirms ļauj skolēniem minēt.',facts:['palette','temp']},
  {t:'Kāda noskaņa?',th:'Noskaņu rada krāsas, gaisma un tas, kas notiek attēlā. Gaišs attēls bieži šķiet priecīgs, tumšs šķiet noslēpumains vai skumjš.',q:['Kā tu justos, ja varētu ieiet šajā attēlā?','Ko tu attēlā redzi, kas liek tev tā domāt?','Kas rada šo sajūtu: krāsas, gaisma vai tas, kas attēlots?','Kādas skaņas te varētu dzirdēt? Kādas smaržas sajust?'],moods:true,terms:['noskana','tonis'],tools:['gray'],tip:'Vispirms ļauj skolēniem pašiem nosaukt sajūtu saviem vārdiem. Emocijzīmes rādi tikai pēc tam, lai palīdzētu atrast vārdu. Salīdzini krāsaino un pelēko attēlu: vai noskaņa mainās?',facts:['temp','tone']},

  {t:'Kompozīcija un telpa',th:'Kompozīcija ir veids, kā mākslinieks izkārto attēla daļas. Kompozīcija, līnija, forma un proporcijas ir izteiksmes līdzekļi. Dominante ir tas, kas pirmais piesaista skatienu. Mākslinieks to izceļ ar lielumu, krāsu, gaismu vai novietojumu.',q:['Kas pirmais piesaista uzmanību? Kā mākslinieks to izcēlis?','Kas ir priekšplānā, vidusplānā un tālajā plānā (fonā)?','Kādas līnijas dominē: horizontālas, vertikālas, diagonālas vai loki?','Vai lielumi attēlā atbilst dzīvei, vai kaut kas ir apzināti palielināts vai samazināts?','Vai kaut kas atkārtojas un veido ritmu?','Vai kompozīcija ir simetriska vai asimetriska? Vai tā šķiet līdzsvarota?'],terms:['kompozicija','dominante','plani','ritms','lidzsvars','simetrija','horizonts'],tools:['thirds','diag','mirror','weight'],tip:'Ieslēdz rīku „Svara centrs” un ļauj skolēnam novietot marķieri tur, kur, viņaprāt, attēls būtu līdzsvarā. Pēc tam kopā salīdziniet ar rīka aprēķinu. Aprēķins nav vienīgā pareizā atbilde: tas ir vēl viens viedoklis, ko pārbaudīt. Dominante (tas, kas pirmais piesaista skatienu) ne vienmēr sakrīt ar līdzsvara punktu.',facts:['comp']},
  {t:'Krāsa un gaisma',th:'Krāsa, gaisma un faktūra ir izteiksmes līdzekļi. Kolorīts ir darba krāsu kopējais raksturs. Gaisma un ēna veido apjomu un noskaņu. Faktūra ir virsmas raksturs, ko var sataustīt: gluda vai raupja virsma, biezi uzklāta krāsa.',q:['Vai krāsas ir siltas vai vēsas, spilgtas vai pieklusinātas?','No kurienes krīt gaisma? Kur ir gaišākā un tumšākā vieta?','Kur redzams kontrasts: gaišs pret tumšu, silts pret vēsu?','Kāda ir virsma: gluda vai raupja? Vai redzami otas triepieni?'],terms:['kolorits','silt','papildkr','piesat','tonis','gaismena','faktura'],tools:['palette','gray','tempv'],tip:'Pelēktoņu režīmā skolēni vieglāk saskata gaismu un ēnu bez krāsu ietekmes.',facts:['palette','temp','tone','sat']},
  {t:'Sižets un noskaņa',th:'Sižets ir tas, kas notiek attēlā. Attēlojums var būt reālistisks (tuvs dzīvei) vai stilizēts (vienkāršots, pārveidots). Simbols ir tēls, kas norāda uz plašāku nozīmi.',q:['Kas notiek attēlā? Kā figūras vai priekšmeti novietoti?','Vai attēlojums ir reālistisks vai stilizēts?','Vai attēlā ir kāda zīme vai simbols? Ko tas varētu nozīmēt?','Kāda ir noskaņa? Raksturo to ar trim vārdiem.','Kādas skaņas, kustības vai sajūtas tu iztēlojies, skatoties uz šo darbu?','Ar kādiem izteiksmes līdzekļiem mākslinieks šo noskaņu radījis?'],terms:['sizets','realisms','stiliz','simbols','noskana'],tools:['gray'],tip:'Prasi pamatot ar konkrētu vietu attēlā, lai skolēns to parādītu uz tāfeles.',facts:['temp','tone']},
  {t:'Autors un laiks',th:'Katrs mākslas darbs ir sava laika liecība. Zinot, kas, kad un kur darbu radījis, mēs labāk saprotam, ko autors gribēja pastāstīt.',q:['Kas ir autors? Kad un kurā valstī darbs radīts?','Ko darbs stāsta par tā laika cilvēku dzīvi, dabu vai kultūru?','Vai šis darbs atgādina kādu citu darbu, ko esi redzējis? Kas ir līdzīgs, kas atšķirīgs?','Vai darbā ir kaut kas, kas saistās ar Latviju vai tavu dzīvi šodien?'],terms:['konteksts','virziens','stils'],tools:[],tip:'Pastāsti īsi par autoru un laiku, bet ļauj skolēniem pašiem atrast saikni ar darbu. Jautā: „Kas attēlā par to liecina?”',facts:[],meta:true,dyn:true},

 g3:[
  {t:'Pirmā apskate',core:2,veidsSel:true,th:'Analizēt nozīmē sadalīt darbu daļās, raksturot tās un izskaidrot to savstarpējās sakarības. Nesteidzies interpretēt: vispirms nosauc faktus, ko var pārbaudīt, aplūkojot darbu.',q:['Kas ir autors? Kad un kur darbs tapa? Kāds ir nosaukums, tehnika un izmērs? Kur darbs glabājas?','Ko tu redzi pirmajā mirklī: galveno tēlu, notikumu, objektu vai noskaņu?','Kāds ir žanrs: portrets, ainava, klusā daba, sadzīves žanrs vai mitoloģiskais žanrs?'],terms:['veids','zanrs','formats','tehnika','fakts'],tools:['draw'],tip:'Vienojieties par sarunas noteikumiem: uzklausām citus, savu domu pamatojam ar to, ko redzam darbā, un kritizējam darbu, nevis cilvēku. Ja kāds sāk interpretēt, pieraksti domu un atgriezies pie tās 4. vai 5. solī.',facts:['format'],meta:true},

  {t:'Krāsa, gaisma, materiāls',core:2,th:'Krāsa, gaisma un materiāls ir izteiksmes līdzekļi, kas rada noskaņu. Vienmēr jautā: kāpēc mākslinieks izvēlējies tieši šo krāsu, gaismu vai materiālu, un ko tas pievieno darba emocijai vai idejai?',q:['Kolorīts: siltas vai vēsas krāsas, spilgtas vai pieklusinātas, kontrastējošas vai harmoniskas?','Kāpēc mākslinieks izvēlējies tieši šīs krāsas, gaismu un materiālu?','No kurienes krīt gaisma? Kas ir izgaismots, un kas paliek tumsā?','Faktūra un tehnika: vai virsma ir gluda vai raupja? Vai krāsa uzklāta plānās, caurspīdīgās kārtās vai biezi?','Materiāls: kas izmantots – eļļa, akvarelis, ogle, marmors, metāls vai atrasti priekšmeti?'],terms:['kolorits','silt','papildkr','harmonija','piesat','tonis','tonkontr','gaismena','faktura','triepiens','materials'],tools:['palette','gray','tempv'],tip:'Sadali klasi grupās: katra grupa analizē vienu izteiksmes līdzekli un ziņo pārējiem.',facts:['palette','temp','tone','sat']},

  {t:'Konteksts un interpretācija',core:2,th:'Interpretācija balstās uz novērojumiem un kontekstu: laikmetu, kultūru un autora biogrāfiju. Formulē autora iespējamo nolūku un attieksmi. Var būt vairākas pamatotas interpretācijas.',q:['Kādā laikā un sabiedrībā darbs radīts?','Par ko darbs runā: cilvēku, varu, dabu, mīlestību, identitāti, sabiedrību?','Vai darbs pieder kādam mākslas virzienam vai stilam? Kuras pazīmes to rāda?','Kādi varētu būt autora dzīves, sociālie vai politiskie apstākļi?','Kā darbu uztvēra autora laikabiedri? Vai tas bija populārs vai noraidīts, un kāpēc?','Kādu sabiedrībā aktuālu problēmu vai procesu darbs atspoguļo?','Salīdzini šo darbu ar kāda Latvijas mākslinieka darbu par līdzīgu tēmu. Kas kopīgs, kas atšķirīgs?'],terms:['konteksts','virziens','stils','interpr'],tools:[],tip:'Interpretācijai jābalstās uz 2.–4. soļa novērojumiem. Jautā: „Kas attēlā liek tev tā domāt?”',facts:[],meta:true,dyn:true},

function hay(k){const g=G[k];let t=g.t+' '+g.d+' '+(g.k||'');if(g.st)t+=' '+g.st.m+' '+g.st.lv+' '+g.st.al.join(' ')+' '+g.st.laiks;return fold(t);}
const HAY={};KEYS.forEach(k=>HAY[k]=hay(k));
const match=k=>{const q=fold(st.q).trim();if(!q)return true;return q.split(/\s+/).every(w=>HAY[k].includes(w));};
const defOf=k=>{const g=G[k];return st.lvl==='kid'&&g.k?g.k:g.d;};
const plural=(n,a,b)=>n%10===1&&n%100!==11?a:b;
const sortLv=(a,b)=>G[a].t.localeCompare(G[b].t,'lv');

function itemHTML(k,sm){const g=G[k];
  return `<button type="button" class="item ${st.sel===k?'on':''}" data-k="${k}"><small>${esc(sm)}</small><b>${esc(g.t)}</b><span>${esc(defOf(k))}</span></button>`;}

function renderSide(){
  let h='';
  if(st.tab==='vardnica'){
    const base=KEYS.filter(match);
    h+=`<div><div class="sub">Kategorijas</div><div class="cats">${[['all','Visi termini']].concat(Object.entries(CATS)).map(([c,n])=>{const cnt=c==='all'?base.length:base.filter(k=>G[k].c===c).length;return `<button type="button" class="cat ${st.cat===c?'on':''}" data-cat="${c}"><span>${esc(n)}</span><small>${cnt}</small></button>`;}).join('')}</div></div>`;
  }else if(st.tab==='laiks'){
    h+=`<p class="sidenote">Mākslas virzieni un stili sakārtoti pēc to rašanās laika. Noklikšķini uz virziena, lai redzētu tā pazīmes, māksliniekus un piemērus Latvijā.</p>`;
  }else if(st.tab==='analize'){
    h+=`<div><div class="sub">Klašu grupa</div><div class="cats">${Object.entries(VEIDI_NOS).map(([g,n])=>`<button type="button" class="cat ${st.grade===g?'on':''}" data-grade="${g}"><span>${n}</span><small>${STEPS[g].length} soļi</small></button>`).join('')}</div></div><p class="sidenote">Noklikšķini uz termina pie soļa, lai labajā pusē redzētu tā skaidrojumu.</p>`;
  }else{
    h+=`<p class="sidenote">Uzticami avoti padziļinātai izpētei. Saites atveras jaunā cilnē.</p><p class="sidenote"><b>Termini šajā rīkā</b> saskaņoti ar pārējiem visaskola.lv materiāliem, piemēram, faktūra ir virsmas raksturs, ko var sataustīt, bet tekstūra ir virsmas raksts, ko redz.</p>`;
  }
  $('#side').innerHTML=h;
}

function renderCenter(){
  const head=$('#chead'),body=$('#cbody');
  if(st.tab==='vardnica'){
    const list=KEYS.filter(k=>(st.cat==='all'||G[k].c===st.cat)&&match(k)).sort(sortLv);
    head.innerHTML=`<h2>${st.cat==='all'?'Visi termini':esc(CATS[st.cat])}</h2><span>${list.length} ${plural(list.length,'termins','termini')}</span>`;
    body.innerHTML=list.length?`<div class="items">${list.map(k=>itemHTML(k,CATS[G[k].c])).join('')}</div>`:`<div class="noresult">Nekas netika atrasts. Pamēģini citu vārdu vai izvēlies „Visi termini”.</div>`;
  }else if(st.tab==='laiks'){
    const ks=KEYS.filter(k=>G[k].st&&match(k)).sort((a,b)=>G[a].st.y-G[b].st.y||sortLv(a,b));
    head.innerHTML=`<h2>Mākslas virzieni laikā</h2><span>${ks.length} ${plural(ks.length,'virziens','virzieni')}</span>`;
    body.innerHTML=ks.length?PERIODS.map(([a,b,n])=>{const p=ks.filter(k=>G[k].st.y>=a&&G[k].st.y<b);return p.length?`<section class="period"><h3>${n}</h3><div class="tl">${p.map(k=>itemHTML(k,G[k].st.laiks)).join('')}</div></section>`:'';}).join(''):`<div class="noresult">Nekas netika atrasts. Pamēģini citu vārdu.</div>`;
  }else if(st.tab==='analize'){
    const S=STEPS[st.grade];
    head.innerHTML=`<h2>Kā analizēt mākslas darbu</h2><span>${VEIDI_NOS[st.grade]}</span>`;
    body.innerHTML=`<div class="blk"><h3>Analīzes gaita</h3><div class="method">${METHOD.map((m,i)=>`<div class="mstep"><em>${i+1}</em><b>${m[0]}</b><span>${m[1]}</span></div>`).join('')}</div></div>
    <div class="blk"><h3>Fakts vai spriedums</h3><div class="factjud"><div><b>Fakts</b>Kreisajā pusē ir koks.<br>Debesis ir oranžas un violetas.</div><div><b>Spriedums</b>Koks šķiet vientuļš.<br>Krāsas rada vakara noskaņu.</div></div><p class="muted" style="margin:8px 0 0">Vispirms nosauc faktus, ko var pārbaudīt, aplūkojot darbu. Laba analīze nemeklē vienu „pareizo atbildi”, bet parāda, kā izteiksmes līdzekļi rada nozīmi.</p></div>
    <div class="blk"><h3>Analīzes soļi: ${VEIDI_NOS[st.grade]}</h3><div class="steplist">${S.map((s,i)=>`<div class="stp ${st.hlStep===i?'hl':''}" id="stp${i}"><header><em>${i+1}</em><b>${esc(s.t)}</b></header><p>${esc(s.th)}</p>${s.terms.length?`<div class="chips">${s.terms.filter(k=>G[k]).map(k=>`<button type="button" class="chip term ${st.sel===k?'on':''}" data-k="${k}">${esc(G[k].t)}</button>`).join('')}</div>`:''}</div>`).join('')}</div></div>`;
    if(st.hlStep>=0){const el=$('#stp'+st.hlStep);if(el&&el.scrollIntoView)el.scrollIntoView({block:'center'});}
  }else{
    head.innerHTML=`<h2>Avoti</h2><span>${LINKS.length} saites</span>`;
    body.innerHTML=`<div class="lcards">${LINKS.map(l=>`<a class="lcard" href="${l[0]}" target="_blank" rel="noopener"><b>${esc(l[1])}</b><span>${esc(l[2])}</span></a>`).join('')}</div>`;
  }
}

function renderDetail(){
  const d=$('#detail'),k=st.sel,g=G[k];
  if(!g){d.innerHTML=`<div class="empty2"><b>Izvēlies terminu sarakstā.</b><span>Šeit parādīsies tā skaidrojums.</span></div>`;return;}
  let h=`<div><div class="cat-lbl">${esc(CATS[g.c])}</div><h2 class="dt">${esc(g.t)}</h2></div>`;
  if(g.st){const x=g.st;
    h+=`<p class="dd">${esc(x.p)}</p><dl class="facts2"><dt>Laiks</dt><dd>${esc(x.laiks)}</dd><dt>Mākslinieki</dt><dd>${esc(x.m)}</dd>${x.lv?`<dt>Latvijā</dt><dd>${esc(x.lv)}</dd>`:''}</dl>${x.u?`<a class="ext" href="${TATE+x.u}" target="_blank" rel="noopener">Tate skaidrojums (angļu val.) ↗</a>`:''}`;
  }else{
    const kidOnly=st.lvl==='kid'&&g.k;
    h+=`<p class="dd">${esc(kidOnly?g.k:g.d)}</p>`;
    if(g.k&&!kidOnly)h+=`<div class="kidbox"><b>Vienkāršāk (1.–3. klasei)</b><p>${esc(g.k)}</p></div>`;
    if(kidOnly)h+=`<div class="kidbox"><b>Pilns skaidrojums</b><p>${esc(g.d)}</p></div>`;
  }
  const use=USE[k];
  if(use&&use.length)h+=`<div><div class="sub">Lietots analīzes soļos</div><div class="chips">${use.map(u=>`<button type="button" class="chip go" data-go="${u.g}:${u.i}">${GRADE_LABEL[u.g]} · ${esc(u.t)}</button>`).join('')}</div></div>`;
  const rel=KEYS.filter(x=>x!==k&&G[x].c===g.c).sort(sortLv);
  if(rel.length){const pick=g.st?rel.slice().sort((a,b)=>Math.abs(G[a].st.y-g.st.y)-Math.abs(G[b].st.y-g.st.y)).slice(0,6).sort((a,b)=>G[a].st.y-G[b].st.y):rel.slice(0,8);
    if(pick.length)h+=`<div><div class="sub">${g.st?'Tuvi laikā':'Saistītie termini'}</div><div class="chips">${pick.map(x=>`<button type="button" class="chip term" data-k="${x}">${esc(G[x].t)}</button>`).join('')}</div></div>`;}
  d.innerHTML=h;d.scrollTop=0;
}

function renderTabs(){$$('[data-tab]').forEach(b=>{const on=b.dataset.tab===st.tab;b.classList.toggle('on',on);b.setAttribute('aria-selected',on);});}
function renderAll(){renderTabs();renderSide();renderCenter();renderDetail();}
function select(k){if(!G[k])return;st.sel=k;$$('[data-k]').forEach(b=>b.classList.toggle('on',b.dataset.k===k));renderDetail();}

document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.tab){st.tab=t.dataset.tab;st.hlStep=-1;renderAll();$('#cbody').scrollTop=0;return;}
  if(t.dataset.cat){st.cat=t.dataset.cat;renderSide();renderCenter();$('#cbody').scrollTop=0;return;}
  if(t.dataset.grade){st.grade=t.dataset.grade;st.hlStep=-1;renderSide();renderCenter();$('#cbody').scrollTop=0;return;}
  if(t.dataset.lvl){st.lvl=t.dataset.lvl;$$('[data-lvl]').forEach(b=>b.classList.toggle('on',b===t));renderCenter();renderDetail();return;}
  if(t.dataset.go){const [g,i]=t.dataset.go.split(':');st.tab='analize';st.grade=g;st.hlStep=+i;renderTabs();renderSide();renderCenter();return;}
  if(t.dataset.k){const k=t.dataset.k;if(st.tab==='vardnica'&&!$(`.items [data-k="${k}"]`)){/* saistītais termins citā kategorijā */st.cat='all';st.q='';$('#q').value='';renderSide();renderCenter();}select(k);const it=$(`#cbody .item[data-k="${k}"]`);if(it&&it.scrollIntoView)it.scrollIntoView({block:'nearest'});return;}
});
$('#q').addEventListener('input',e=>{st.q=e.target.value;if(st.tab==='analize'||st.tab==='avoti'){st.tab='vardnica';renderTabs();}renderSide();renderCenter();});
{const hb=$('#homeBtn');const home=()=>{Object.assign(st,{tab:'vardnica',cat:'all',lvl:'full',sel:'kompozicija',grade:'g2',hlStep:-1,q:''});$('#q').value='';$$('[data-lvl]').forEach(b=>b.classList.toggle('on',b.dataset.lvl==='full'));renderAll();$('#cbody').scrollTop=0;};
 hb.addEventListener('click',home);hb.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();home();}});}

/* mērogošana un pilnekrāns */
function scaleApp(){const r=document.documentElement;if(innerWidth<=760){r.style.removeProperty('--s');return;}r.style.setProperty('--s',Math.min(innerWidth/1600,innerHeight/900));}
window.addEventListener('resize',scaleApp);scaleApp();
document.addEventListener('fullscreenchange',()=>{$('#fullTxt').textContent=document.fullscreenElement?'Iziet no pilnekrāna režīma':'Atvērt pilnekrāna režīmu';});
$('#btnFull').addEventListener('click',()=>{try{if(document.fullscreenElement)document.exitFullscreen();else{const p=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();if(p&&p.catch)p.catch(()=>{});}}catch(e){}});

renderAll();
})();
</script>
</body>
</html>
